<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Full Stack Engineer crafting scalable web apps with React, Node.js & TypeScript. Portfolio of Harsh Raj — projects, blog, and contact." />

    <meta name="keywords" content="full stack developer, react, node.js, typescript, portfolio, web developer" />
    <!-- Open Graph -->
    <meta property="og:title" content="Harsh Raj | Full-Stack Developer" />
    <meta property="og:description" content="Full Stack Engineer crafting scalable web apps with React, Node.js & TypeScript." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harshx.in" />
    <meta property="og:image" content="https://www.harshx.in/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Harsh Raj, Full-Stack Developer, harshx.in" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harsh Raj | Full-Stack Developer" />
    <meta name="twitter:description" content="Full Stack Engineer crafting scalable web apps with React, Node.js & TypeScript." />
    <meta name="twitter:image" content="https://www.harshx.in/og-image.jpg" />
    <meta name="twitter:image:alt" content="Harsh Raj, Full-Stack Developer, harshx.in" />
    <title>Harsh Raj | Full-Stack Developer</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Preload the GitHub avatar used by Hero + About. Must match getAvatarUrl() in src/services/githubUser.js exactly. -->
    <link rel="preload" as="image" href="https://avatars.githubusercontent.com/u/217300092?v=4&s=400" fetchpriority="high" />
    <!-- Anonymous (CORS) connection for the canvas favicon; the preload above opens the regular one -->
    <link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Nunito:wght@400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Press+Start+2P&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
    <!-- CSP: vercel.json allows this inline script by its sha256 hash. Any edit to it (even whitespace) needs a new hash, see README "Content Security Policy". -->
    <script>
      /* Apply saved theme instantly — before React mounts — to prevent flash */
      (function () {
        try {
          var t = localStorage.getItem('pf-theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
